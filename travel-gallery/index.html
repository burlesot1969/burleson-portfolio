<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eastern European Trip - Interactive Collage</title>
  <meta name="description" content="Eastern European Trip full-screen 3x5 photo collage with interactive hotspots and full-resolution lightbox preview.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>

  <!-- Fullscreen Base Collage View -->
  <main class="fullscreen-collage-container">
    
    <!-- Header Badge -->
    <div class="header-badge">
      <span class="badge-icon">🗺️</span>
      <span class="badge-title">Eastern European Trip</span>
      <span class="badge-hint">• Click any photo tile to view full image</span>
    </div>

    <!-- The 3x5 Base Collage Image Wrapper (4:5 Aspect Ratio) -->
    <div class="collage-wrapper" id="collage-wrapper">
      <!-- 3x5 Base Collage Poster Image -->
      <img src="images/Eastern European Trip.png?v=6.0" alt="Eastern European Trip 3x5 Collage" class="base-collage-img" id="base-collage-img">
      
      <!-- 3x5 Grid Hotspot Overlay (15 Interactive Cells) -->
      <div class="grid-hotspots-overlay" id="grid-hotspots-overlay">
        <!-- 15 Hotspot cells generated by JS (3 rows x 5 columns) -->
      </div>
    </div>

  </main>

  <!-- Fullscreen Lightbox Modal (Tap/Click Image to Return to Collage) -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo View">
    <!-- Backdrop overlay (Clicking background closes lightbox) -->
    <div class="lightbox-overlay" id="lightbox-overlay"></div>
    
    <!-- 'X' Close Button -->
    <button class="lightbox-close" id="lightbox-close" aria-label="Close photo preview and return to collage">
      &times;
    </button>
    
    <!-- Lightbox Content Area -->
    <div class="lightbox-content" id="lightbox-content">
      <div class="lightbox-image-wrapper" id="lightbox-image-wrapper" title="Click or tap image to return to collage">
        <img id="lightbox-img" src="" alt="Full resolution travel photo">
        <div class="click-to-close-hint">✕ Click or tap image to return to collage</div>
      </div>
      <div class="lightbox-caption" id="lightbox-caption">
        <h3 id="lightbox-title">Photo Title</h3>
        <p id="lightbox-location">📍 Location Caption</p>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js?v=6.0"></script>
</body>
</html>
